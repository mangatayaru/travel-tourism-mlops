apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-ui
  template:
    metadata:
      labels:
        app: travel-ui
    spec:
      containers:
        - name: ui
          image: YOUR_REGISTRY/travel-ui:latest
          ports:
            - containerPort: 8501
          env:
            - name: FLASK_API_URL
              value: http://travel-api:5000
---
apiVersion: v1
kind: Service
metadata:
  name: travel-ui
spec:
  selector:
    app: travel-ui
  ports:
    - port: 8501
      targetPort: 8501
  type: LoadBalancer
